spring.application.name=itineria

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/itineraria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=debug
logging.file.path=logs

logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.org.springframework.security=DEBUG


logging.level.org.springframework.security.web.savedrequest=OFF

spring.flyway.enabled=true

# Percorso dello storage dei documenti
file.storage.location=uploads

# Necessario per i form Thymeleaf che usano th:method="put"/"delete"
spring.mvc.hiddenmethod.filter.enabled=true

# Limiti upload file (default Spring/Tomcat: 1MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

