spring.application.name=itineria

spring.datasource.username=root
spring.datasource.password=root
spring.datasource.url=jdbc:mysql://localhost:3306/itineria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=validate

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=debug
logging.file.path=logs

logging.level.org.hibernate.orm.jdbc.bind=trace

logging.level.org.springframework.security=DEBUG


logging.level.org.springframework.security.web.savedrequest=OFF

spring.flyway.enabled=true

# Percorso dello storage dei documenti
file.storage.location=uploads