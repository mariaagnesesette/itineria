<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Nuovo evento</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="/css/pages.css">
    <link rel="stylesheet" th:href="@{/css/luogoDettaglio.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <link rel="icon" type="image/png" th:href="@{/images/favicon-bianco.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="account-page">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="area-personale-wrapper">

        <div class="profile-header-title">
            <span>GESTIONE EVENTI</span>
            <h1>Nuovo evento</h1>
        </div>

        <div class="card-box">

            <p class="form-message" th:if="${#lists.isEmpty(luoghi)}">
                Non hai ancora nessun luogo a cui associare un evento. Crea prima un luogo di interesse.
            </p>

            <form th:if="${!#lists.isEmpty(luoghi)}"
                  th:action="@{/eventi}" th:object="${eventoDTO}" method="POST">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" th:field="*{nome}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="descrizione">Descrizione</label>
                        <textarea id="descrizione" th:field="*{descrizione}" rows="4"></textarea>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="idLuogoInteresse">Luogo</label>
                        <select id="idLuogoInteresse" th:field="*{idLuogoInteresse}" required>
                            <option th:each="l : ${luoghi}" th:value="${l.id}" th:text="${l.nome}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="tipologiaEvento">Tipologia</label>
                        <select id="tipologiaEvento" th:field="*{tipologiaEvento}">
                            <option th:each="t : ${tipologieEvento}" th:value="${t}" th:text="${t}"></option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="pubblicoEvento">Pubblico</label>
                        <select id="pubblicoEvento" th:field="*{pubblicoEvento}">
                            <option th:each="p : ${pubbliciEvento}" th:value="${p}" th:text="${p}"></option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="prezzo">Prezzo (€)</label>
                        <input type="number" step="0.01" min="0" id="prezzo" th:field="*{prezzo}" required>
                    </div>
                </div>

                <div class="services-grid" style="margin-bottom:18px;">
                    <label><input type="checkbox" th:field="*{prenotazione}"> Con prenotazione</label>
                </div>

                <h2 style="margin-top:24px;">Data e orario</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dataInizio">Data inizio</label>
                        <input type="date" id="dataInizio" th:field="*{dateEvento[0].dataInizio}" required>
                    </div>
                    <div class="form-group">
                        <label for="dataFine">Data fine</label>
                        <input type="date" id="dataFine" th:field="*{dateEvento[0].dataFine}">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="oraInizio">Ora inizio</label>
                        <input type="time" id="oraInizio" th:field="*{dateEvento[0].oraInizio}">
                    </div>
                    <div class="form-group">
                        <label for="oraFine">Ora fine</label>
                        <input type="time" id="oraFine" th:field="*{dateEvento[0].oraFine}">
                    </div>
                </div>

                <p class="form-message">
                    Potrai aggiungere altre date all'evento dopo la creazione, dalla sua pagina di gestione.
                </p>

                <button type="submit" class="btn-submit-action">Crea evento</button>
                <a th:href="@{/eventi}" class="btn-action-text" style="margin-left:14px;">Annulla</a>
            </form>

        </div>

    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
