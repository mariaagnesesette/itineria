<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Biblioteche di Torino — Itineraria</title>


    <!-- Google Fonts -->
    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">


    <!-- CSS GLOBALE -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">


    <!-- CSS BIBLIOTECHE -->
    <link rel="stylesheet"
          th:href="@{/css/biblioteche.css}">

    <link rel="icon" type="image/png" th:href="@{/images/favicon-bianco.png}">

</head>


<body>


<!-- ==========================================================================
     NAVBAR
     ========================================================================== -->

<div th:replace="~{fragments/navbar :: navbar}"></div>



<!-- ==========================================================================
     PAGE INTRO
     ========================================================================== -->

<section class="page-intro">

    <div class="container">



        <!-- TITOLO -->
        <h1 class="page-intro__title">

            <i class="fa-solid fa-book-open"></i>

            Biblioteche di Torino

        </h1>



        <!-- DESCRIZIONE -->
        <p class="page-intro__desc">

            Scopri le biblioteche di Torino:
            spazi per leggere, studiare, lavorare e dedicarsi alla cultura.

        </p>



        <!-- ==========================================================================
             UNICA BARRA DI RICERCA
             ========================================================================== -->

        <div class="biblioteche-search">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                id="bibliotecheSearchInput"
                placeholder="Cerca una biblioteca per nome...">

        </div>



        <!-- ==========================================================================
             FILTRI RAPIDI
             ========================================================================== -->

        <div class="filter-chips"
             id="filterChips">


            <button
                type="button"
                class="filter-chip active"
                data-filter="all">

                Tutte

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="pubblico">

                <i class="fa-solid fa-building-columns"></i>
                Pubbliche

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="wifi">

                <i class="fa-solid fa-wifi"></i>
                WiFi

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="area-computer">

                <i class="fa-solid fa-computer"></i>
                Area computer

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="area-bambini">

                <i class="fa-solid fa-child-reaching"></i>
                Area bambini

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="sempre-aperto">

                <i class="fa-solid fa-clock"></i>
                Sempre aperte

            </button>


            <button
                type="button"
                class="filter-chip"
                data-filter="accessibile">

                <i class="fa-solid fa-wheelchair"></i>
                Accessibile

            </button>


        </div>


        <!-- ==========================================================================
             FORM NASCOSTO
             Usato dal tuo biblioteche.js.
             Non viene mostrata una seconda barra.
             ========================================================================== -->

        <form
            th:action="@{/biblioteche/filtri}"
            method="get"
            id="bibliotecheFilterForm"
            hidden>


            <!-- Nome -->
            <input
                type="hidden"
                name="nome"
                id="nomeInput">


            <!-- Pubblico -->
            <input
                type="hidden"
                name="pubblico"
                id="pubblicoInput">


            <!-- WiFi -->
            <input
                type="hidden"
                name="wifi"
                id="wifiInput">


            <!-- Computer -->
            <input
                type="hidden"
                name="areaComputer"
                id="areaComputerInput">


            <!-- Bambini -->
            <input
                type="hidden"
                name="areaBambini"
                id="areaBambiniInput">


            <!-- Sempre aperto -->
            <input
                type="hidden"
                name="sempreAperto"
                id="sempreApertoInput">


            <!-- Accessibilità -->
            <input
                type="hidden"
                name="accessibilita"
                id="accessibilitaInput">


        </form>


    </div>

</section>



<!-- ==========================================================================
     TUTTE LE BIBLIOTECHE / RISULTATI FILTRATI
     ========================================================================== -->

<section class="section">

    <div class="container">


        <!-- HEADER RISULTATI -->

        <div class="biblioteche-results-header">


            <h2 class="section__title">

                <i class="fa-solid fa-book"></i>

                Biblioteche

            </h2>


            <span
                class="biblioteche-results-count"
                th:if="${risultati != null}"
                th:text="${risultati.totalElements} + ' risultati'">

                0 risultati

            </span>


        </div>



        <!-- ==========================================================================
             GRIGLIA
             ========================================================================== -->

        <div
            class="biblioteca-grid"
            th:if="${risultati != null && !risultati.isEmpty()}">


            <a
                th:each="biblioteca : ${risultati.content}"
                th:href="@{'/biblioteche/' + ${biblioteca.id}}"
                class="biblioteca-card">


                <!-- ICONA -->
                <span class="biblioteca-card__icon">

                    <i class="fa-solid fa-book-open"></i>

                </span>



                <!-- BODY -->
                <span class="biblioteca-card__body">


                    <!-- NOME -->
                    <span
                        class="biblioteca-card__title"
                        th:text="${biblioteca.nome}">

                        Nome biblioteca

                    </span>


                    <!-- DESCRIZIONE -->
                    <span
                        class="biblioteca-card__desc"
                        th:text="${biblioteca.descrizione}">

                        Descrizione della biblioteca

                    </span>



                    <!-- ==============================================================
                         BADGE SERVIZI
                         ============================================================== -->

                    <span class="biblioteca-card__badges">


                        <span
                            class="badge"
                            th:if="${biblioteca.pubblico}">

                            <i class="fa-solid fa-building-columns"></i>

                            Pubblica

                        </span>


                        <span
                            class="badge"
                            th:if="${biblioteca.wifi}">

                            <i class="fa-solid fa-wifi"></i>

                            WiFi

                        </span>


                        <span
                            class="badge"
                            th:if="${biblioteca.areaComputer}">

                            <i class="fa-solid fa-computer"></i>

                            Computer

                        </span>


                        <span
                            class="badge"
                            th:if="${biblioteca.areaBambini}">

                            <i class="fa-solid fa-child-reaching"></i>

                            Bambini

                        </span>


                        <span
                            class="badge"
                            th:if="${biblioteca.sempreAperto}">

                            <i class="fa-solid fa-clock"></i>

                            24/24

                        </span>


                        <span
                            class="badge"
                            th:if="${biblioteca.accessibilita != null}">

                            <i class="fa-solid fa-wheelchair"></i>

                            Accessibile

                        </span>


                    </span>


                </span>



                <!-- FRECCIA -->
                <i class="fa-solid fa-arrow-right biblioteca-card__arrow"></i>


            </a>


        </div>



        <!-- ==========================================================================
             NESSUN RISULTATO
             ========================================================================== -->

        <p
            class="biblioteca-empty-state"
            th:if="${risultati == null || risultati.isEmpty()}">

            <i class="fa-solid fa-magnifying-glass"></i>

            Nessuna biblioteca trovata.
            Prova con un altro filtro.

        </p>


    </div>

</section>



<!-- ==========================================================================
     FOOTER
     ========================================================================== -->

<div th:replace="~{fragments/footer :: footer}"></div>



<!-- ==========================================================================
     JAVASCRIPT
     ========================================================================== -->

<script th:src="@{/js/luoghi_dettaglio/biblioteche.js}" defer></script>

</body>

</html>
