<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parchi e Zone Verdi — Itineraria</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- css style globale per rendere funzionante tutto (forse)-->
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">

  <!-- CSS progetto (crea zoneVerdi.css in static/css oppure usa style.css) -->
  <link rel="stylesheet" th:href="@{/css/parchi.css}">
</head>

<body>

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <section class="page-intro">
    <div class="container">
      <h1 class="page-intro__title"><i class="fa-solid fa-tree"></i> Parchi e Zone Verdi</h1>
      <p class="page-intro__desc">
        Spazi verdi, parchi cittadini e aree naturali da scoprire.
      </p>

      <div class="park-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="parkSearchInput" placeholder="Cerca un parco per nome...">
      </div>

      <div class="filter-chips category-filters">
        <button type="button" class="filter-chip active" data-filter="all">Tutti</button>
        <button type="button" class="filter-chip" data-filter="PARCO_URBANO"><i class="fa-solid fa-tree-city"></i> Parchi urbani</button>
        <button type="button" class="filter-chip" data-filter="PARCO_NATURALE"><i class="fa-solid fa-mountain"></i> Aree naturali</button>
        <button type="button" class="filter-chip" data-filter="PARCO_STORICO"><i class="fa-solid fa-landmark"></i> Giardini storici</button>
        <button type="button" class="filter-chip" data-filter="GIARDINO_PUBBLICO"><i class="fa-solid fa-seedling"></i> Giardini pubblici</button>
        <button type="button" class="filter-chip" data-filter="AREA_CANI"><i class="fa-solid fa-dog"></i> Aree per cani</button>
        <button type="button" class="filter-chip" data-filter="ORTO_BOTANICO"><i class="fa-solid fa-spa"></i> Orti botanici</button>
        <button type="button" class="filter-chip" data-filter="RISERVA_NATURALE"><i class="fa-solid fa-mountain-sun"></i> Riserve naturali</button>
      </div>

      <div class="filter-chips feature-filters">
        <span class="filter-divider" aria-hidden="true"></span>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="dogFriendly">
          <i class="fa-solid fa-check filter-chip__check"></i> Dog friendly
        </button>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="ristoro">
          <i class="fa-solid fa-check filter-chip__check"></i> Ristoro
        </button>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="ciclabile">
          <i class="fa-solid fa-check filter-chip__check"></i> Ciclabile
        </button>
      </div>
  </section>

  <form th:object="${zonaVerdeDTO}" th:action="@{/zoneVerdi/filtri}" method="get" id="parchiFilterForm" hidden>
    <input type="hidden" th:field="*{nome}" id="nomeParcoInput">
  </form>



  <section class="section" th:if="${parchi != null}">
    <div class="container">
      <div class="parchi-results-header">
        <h2 class="section__title">
          <i class="fa-solid fa-tree"></i>
          Parchi e zone verdi
        </h2>
          <span class="parchi-results-count"
            th:text="${risultati != null ? risultati.totalElements + ' risultati' : (parchi != null ? #lists.size(parchi) + ' risultati' : '0 risultati')}">
          0 risultati
        </span>
      </div>
      <div class="park-grid">
        <a th:each="parco : ${parchi}" th:href="@{/zoneVerdi/{id}(id=${parco.id})}" class="park-card"
          th:attr="data-category=${parco.tipologia}, data-dog-friendly=${parco.dogFriendly}, data-ristoro=${parco.ristoro}, data-ciclabile=${parco.ciclabile}">
          <span class="park-card__icon"><i class="fa-solid fa-tree"></i></span>
          <span class="park-card__body">
            <span class="park-card__title" th:text="${parco.nome}">Nome parco</span>
            <span class="park-card__desc" th:text="${parco.descrizione}">Descrizione breve</span>
            <span class="park-card__badges">
              <span class="badge" th:if="${parco.areaMq != null}">
                <i class="fa-solid fa-ruler-combined"></i>
                <span th:text="${#numbers.formatDecimal(parco.areaMq, 1, 'COMMA', 2, 'POINT')} + ' m²'"></span>
              </span>
              <span class="badge" th:if="${parco.dogFriendly}">
                <i class="fa-solid fa-dog"></i>
                Dog friendly
              </span>
              <span class="badge" th:if="${parco.ristoro}">
                <i class="fa-solid fa-mug-saucer"></i>
                Ristoro
              </span>
              <span class="badge" th:if="${parco.ciclabile}">
                <i class="fa-solid fa-person-biking"></i>
                Ciclabile
              </span>
              <span class="badge" th:if="${parco.accessibilita != null}">
                <i class="fa-solid fa-wheelchair"></i>
                Accessibile
              </span>
            </span>
          </span>
          <i class="fa-solid fa-arrow-right park-card__arrow"></i>
        </a>
      </div>
    </div>
  </section>

  <p class="park-empty-state" id="parkEmptyState"
    th:if="${parchi == null || #lists.isEmpty(parchi)}">
    <i class="fa-solid fa-magnifying-glass"></i> Nessun parco trovato. Prova con un altro filtro.
  </p>

  <footer th:replace="~{fragments/footer :: footer}"></footer>

  <script>
    (function () {
      "use strict";

      var categoryChips = Array.prototype.slice.call(
        document.querySelectorAll(
          '.category-filters .filter-chip:not(.filter-chip--toggle)'
        )
      );

      var toggleChips = Array.prototype.slice.call(
        document.querySelectorAll('.filter-chip--toggle')
      );

      var cards = Array.prototype.slice.call(
        document.querySelectorAll('.park-card')
      );

      var searchInput = document.getElementById('parkSearchInput');
      var form = document.getElementById('parchiFilterForm');
      var activeFeatures = {};
      var activeCategory = 'all';

      function applyFilters() {
        cards.forEach(function (card) {
          var categoryMatches = activeCategory === 'all' ||
            card.getAttribute('data-category') === activeCategory;
          var featureMatches = Object.keys(activeFeatures).every(function (feature) {
            return card.getAttribute('data-' + feature.replace(/[A-Z]/g, function (letter) {
              return '-' + letter.toLowerCase();
            })) === 'true';
          });

          card.style.display = categoryMatches && featureMatches ? '' : 'none';
        });
      }

      categoryChips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          categoryChips.forEach(function (item) {
            item.classList.remove('active');
          });

          chip.classList.add('active');


          activeCategory = chip.getAttribute('data-filter');

          if (activeCategory === 'all') {
            window.location.href = '/zoneVerdi';
            return;
          }

          applyFilters();
        });
      });

      toggleChips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var feature = chip.getAttribute('data-feature');
          var isActive = chip.classList.toggle('active');

          if (isActive) {
            activeFeatures[feature] = true;
          } else {
            delete activeFeatures[feature];
          }

          applyFilters();
        });
      });

      if (searchInput) {
        searchInput.addEventListener('keyup', function (event) {
          if (event.key === 'Enter') {
            document.getElementById('nomeParcoInput').value =
              searchInput.value.trim();

            form.submit();
          }
        });
      }
    })();
  </script>

</body>

</html>
