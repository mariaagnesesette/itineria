<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Musei di Torino — Itineria</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS del progetto -->
  <link rel="stylesheet" th:href="@{/css/musei.css}">
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <!-- HEADER / NAVBAR (server-side fragment) -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <!-- PAGE INTRO — Breadcrumb + titolo + ricerca musei -->
  <section class="page-intro">
    <div class="container">
      <nav class="breadcrumb" aria-label="breadcrumb">
        <a th:href="@{/}" href="index.html">Home</a>
        <i class="fa-solid fa-chevron-right"></i>
        <span>Musei</span>
      </nav>

      <h1 class="page-intro__title"><i class="fa-solid fa-landmark"></i> Musei di Torino</h1>
      <p class="page-intro__desc">
        Da Museo Egizio alle Residenze Reali UNESCO: collezioni da scoprire in città, organizzati per categoria.
      </p>

      <div class="museum-search">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="museumSearchInput" placeholder="Cerca un museo per nome...">
      </div>

      <div class="filter-chips category-filters" id="filterChips">
        <button type="button" class="filter-chip active" data-filter="all">Tutti</button>
        <button type="button" class="filter-chip" data-filter="ARTE"><i class="fa-solid fa-palette"></i> Arte</button>
        <button type="button" class="filter-chip" data-filter="STORIA"><i class="fa-solid fa-scroll"></i> Storia</button>
        <button type="button" class="filter-chip" data-filter="SCIENZA"><i class="fa-solid fa-flask"></i> Scienza</button>
        <button type="button" class="filter-chip" data-filter="ARCHEOLOGIA"><i class="fa-solid fa-monument"></i> Archeologia</button>
        <button type="button" class="filter-chip" data-filter="STORIA_NATURALE"><i class="fa-solid fa-dna"></i> Storia naturale</button>
        <button type="button" class="filter-chip" data-filter="ETNOGRAFICO"><i class="fa-solid fa-globe"></i> Etnografia</button>
        <button type="button" class="filter-chip" data-filter="MILITARE"><i class="fa-solid fa-shield-halved"></i> Militare</button>
        <button type="button" class="filter-chip" data-filter="SCIENZE_NATURALI"><i class="fa-solid fa-leaf"></i> Scienze naturali</button>
        <button type="button" class="filter-chip" data-filter="MUSICA"><i class="fa-solid fa-music"></i> Musica</button>
        <button type="button" class="filter-chip" data-filter="RELIGIOSO_SACRO"><i class="fa-solid fa-place-of-worship"></i> Arte Sacra</button>
        <button type="button" class="filter-chip" data-filter="CASA_MUSEO"><i class="fa-solid fa-house"></i> Casa museo</button>
        <button type="button" class="filter-chip" data-filter="TRASPORTI"><i class="fa-solid fa-train"></i> Trasporti</button>
        <button type="button" class="filter-chip" data-filter="MULTIDISCIPLINARE"><i class="fa-solid fa-shapes"></i> Multidisciplinare</button>
      </div>

      <div class="filter-chips feature-filters">
        <span class="filter-divider" aria-hidden="true"></span>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="guida">
          <i class="fa-solid fa-check filter-chip__check"></i> Guida prenotabile
        </button>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="bar">
          <i class="fa-solid fa-check filter-chip__check"></i> Bar interno
        </button>
        <button type="button" class="filter-chip filter-chip--toggle" data-feature="accessibile">
          <i class="fa-solid fa-check filter-chip__check"></i> Accessibile
        </button>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <h2 class="section__title"><i class="fa-solid fa-landmark"></i> Tutti i musei</h2>
      <div class="museum-grid">
        <a th:each="museo : ${musei}" th:href="@{'/musei/' + ${museo.id}}" class="museum-card"
          th:attr="data-category=${museo.tipologia}, data-guida=${museo.guidaPrenotabile}, data-bar=${museo.barInterno}, data-accessibile=${museo.accessibilita != null}">
          <span class="museum-card__icon"><i class="fa-solid fa-landmark"></i></span>
          <span class="museum-card__body">
            <span class="museum-card__title" th:text="${museo.nome}">Nome museo</span>
            <span class="museum-card__desc" th:text="${museo.descrizione}">Descrizione breve</span>
            <span class="museum-card__badges">
              <span class="badge" th:if="${museo.accessibilita != null}">
                <i class="fa-solid fa-wheelchair"></i>
                Accessibile
              </span>
              <span class="badge" th:if="${museo.guidaPrenotabile}">
                <i class="fa-solid fa-headset"></i>
                Guida prenotabile
              </span>
              <span class="badge" th:if="${museo.barInterno}">
                <i class="fa-solid fa-mug-saucer"></i>
                Bar interno
              </span>
            </span>
          </span>
          <i class="fa-solid fa-arrow-right museum-card__arrow"></i>
        </a>
      </div>
    </div>
  </section>

  <p class="museum-empty-state" id="museumEmptyState"
    th:if="${musei == null || #lists.isEmpty(musei)}">
    <i class="fa-solid fa-magnifying-glass"></i> Nessun museo trovato. Prova con un altro filtro.
  </p>

  <!-- FOOTER -->
  <footer th:replace="~{fragments/footer :: footer}"></footer>
  <!-- JAVASCRIPT — filtri per categoria + ricerca live
     Suggerimento: spostare in /js/musei.js e includere con <script th:src="@{/js/musei.js}" defer></script>
-->
  <script>
    (function () {
      "use strict";

      var categoryChips = Array.prototype.slice.call(
        document.querySelectorAll('.category-filters .filter-chip')
      );
      var toggleChips = Array.prototype.slice.call(
        document.querySelectorAll('.filter-chip--toggle')
      );
      var cards = Array.prototype.slice.call(document.querySelectorAll('.museum-card'));
      var searchInput = document.getElementById('museumSearchInput');
      var emptyState = document.getElementById('museumEmptyState');
      var activeFeatures = {};
      var activeCategory = 'all';

      function applyFilters() {
        var query = searchInput ? searchInput.value.trim().toLowerCase() : '';
        var anyVisible = false;

        cards.forEach(function (card) {
          var titleEl = card.querySelector('.museum-card__title');
          var title = titleEl ? titleEl.textContent.toLowerCase() : '';
          var matchesQuery = query === '' || title.indexOf(query) !== -1;

          var matchesCategory = activeCategory === 'all' ||
            card.getAttribute('data-category') === activeCategory;

          var matchesFeatures = Object.keys(activeFeatures).every(function (feature) {
            return card.getAttribute('data-' + feature) === 'true';
          });

          var visible = matchesQuery && matchesCategory && matchesFeatures;
          card.style.display = visible ? '' : 'none';
          if (visible) anyVisible = true;
        });

        if (emptyState) emptyState.hidden = anyVisible;
      }

      categoryChips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          categoryChips.forEach(function (c) { c.classList.remove('active'); });
          chip.classList.add('active');

          activeCategory = chip.getAttribute('data-filter');
          applyFilters();
        });
      });

      toggleChips.forEach(function (chip) {
        chip.addEventListener('click', function () {
          var feature = chip.getAttribute('data-feature');
          var isActive = chip.classList.toggle('active');

          if (isActive) {
            activeFeatures[feature] = true;
          } else {
            delete activeFeatures[feature];
          }

          applyFilters();
        });
      });

      if (searchInput) {
        searchInput.addEventListener('input', applyFilters);
      }

      applyFilters();
    })();
  </script>

</body>

</html>
