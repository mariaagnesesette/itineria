<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title th:text="${evento.titolo} + ' | Itineria'">Evento</title>
  <link rel="stylesheet" th:href="@{/css/eventi.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="detail-wrapper" th:fragment="eventoDetailFragment">
  <section class="hero">
    <h1 th:text="${evento.titolo}">Titolo</h1>
    <p th:text="${evento.sottotitolo}">Sottotitolo</p>
    <div class="meta">
      <span th:if="${evento.citta != null}" th:text="${evento.citta.nome}"></span>
      <div th:if="${!#lists.isEmpty(evento.dateEvento)}" th:each="d : ${evento.dateEvento}">
        <span th:text="${#temporals.format(d.dataInizio,'dd/MM/yyyy')}"></span>
        <span th:if="${d.dataFine != null && d.dataFine != d.dataInizio}"> - <span th:text="${#temporals.format(d.dataFine,'dd/MM/yyyy')}"></span></span>
        <span> — </span>
        <span th:text="${#temporals.format(d.oraInizio,'HH:mm')} + ' - ' + #temporals.format(d.oraFine,'HH:mm')}"></span>
      </div>
    </div>
  </section>

  <section class="card">
    <h2>Descrizione</h2>
    <div th:utext="${evento.descrizione}"></div>
  </section>

  <section class="card">
    <h3>Informazioni rapide</h3>
    <ul>
      <li th:if="${evento.tipologiaEvento != null}"><strong>Tipo:</strong> <span th:text="${evento.tipologiaEvento}">Tipo</span></li>
      <li th:if="${evento.pubblicoEvento != null}"><strong>Pubblico:</strong> <span th:text="${evento.pubblicoEvento}">Pubblico</span></li>
      <li>
        <strong>Prezzo:</strong>
        <span th:text="${evento.prezzo != null ? #numbers.formatDecimal(evento.prezzo, 1, 'COMMA', 2, 'POINT') + ' €' : 'Gratis'}">Prezzo</span>
      </li>
      <li>
        <strong>Fascia prezzo:</strong>
        <span th:text="${evento.prezzo != null ? (evento.prezzo.compareTo(T(java.math.BigDecimal).valueOf(10)) &lt; 0 ? 'Economico' : (evento.prezzo.compareTo(T(java.math.BigDecimal).valueOf(30)) &lt; 0 ? 'Medio' : 'Costoso')) : 'N/A'}">Fascia</span>
      </li>
      <li th:if="${evento.prenotazione}"><strong>Richiede prenotazione</strong></li>
    </ul>
  </section>

  <section class="card">
    <h3>Dove si trova</h3>
    <div th:if="${evento.luogoInteresse != null}">
      <p>
        <strong th:text="${evento.luogoInteresse.nome}">Nome luogo</strong>
        <span th:if="${evento.luogoInteresse.indirizzo != null}"> — <span th:text="${evento.luogoInteresse.indirizzo}">Indirizzo</span></span>
        <span th:if="${evento.luogoInteresse.citta != null}"> (<span th:text="${evento.luogoInteresse.citta.nome}">Città</span>)</span>
      </p>
      <div th:if="${evento.luogoInteresse.link}">
        <a th:href="${evento.luogoInteresse.link}" target="_blank" rel="noopener noreferrer">Sito luogo</a>
      </div>
    </div>
    <div th:unless="${evento.luogoInteresse != null}">
      <p>Luogo non disponibile.</p>
    </div>
  </section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
