<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ristoranti di Torino — Itineraria</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS del progetto -->
  <link rel="stylesheet" th:href="@{/css/ristoranti.css}" href="/css/ristoranti.css">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<!-- Filtri (Thymeleaf-bound) -->
<section class="section filters-section">
  <div class="container">
    <form th:object="${ristoranteDTO}" th:action="@{/ristoranti/filtri}" method="get" class="ristoranti-filter-form">
      <div class="filters-row">
        <input type="text" th:field="*{nome}" id="restaurantSearchInput" placeholder="Cerca ristorante..." class="input--text">

        <select th:field="*{tipoCucina}">
          <option th:each="t : ${T(com.quattromoschettieri.itineria.entities.ristorante.TipoCucina).values()}"
                  th:value="${t}" th:text="${t}">Tipo cucina</option>
          <option th:if="${false}" value="">--</option>
        </select>

        <select th:field="*{fasciaPrezzo}">
          <option th:each="p : ${T(com.quattromoschettieri.itineria.entities.ristorante.FasciaPrezzoRistorante).values()}"
                  th:value="${p}" th:text="${p}">Fascia prezzo</option>
          <option th:if="${false}" value="">--</option>
        </select>

        <label><input type="checkbox" th:field="*{dogFriendly}"> Dog friendly</label>
        <label><input type="checkbox" th:field="*{perCeliaci}"> Per celiaci</label>
        <label><input type="checkbox" th:field="*{postiEsterni}"> Posti esterni</label>

        <button type="submit" class="btn">Applica filtri</button>
      </div>
    </form>
  </div>
</section>

<!-- Ciclo dinamico: categorie con fallback lista piatta -->
<section class="section" th:if="${categorieRistoranti != null}">
  <div class="container">
    <div th:each="categoria : ${categorieRistoranti}" class="restaurant-category" th:id="${categoria.id}">
      <h2 class="section__title">
        <i th:class="'fa-solid ' + ${categoria.icona}"></i>
        <span th:text="${categoria.nome}">Nome categoria</span>
      </h2>
      <div class="restaurant-grid">
        <a th:each="ristorante : ${categoria.ristoranti}"
           th:href="@{'/ristoranti/' + ${ristorante.slug}}"
           th:classappend="${ristorante.preferito} ? ' restaurant-card--featured' : ''"
           class="restaurant-card">
          <span th:if="${ristorante.preferito}" class="restaurant-card__badge">Consigliato</span>
          <span class="restaurant-card__icon"><i th:class="'fa-solid ' + ${ristorante.icona}"></i></span>
          <span class="restaurant-card__body">
            <span class="restaurant-card__title" th:text="${ristorante.nome}">Nome ristorante</span>
            <span class="restaurant-card__desc" th:text="${ristorante.descrizione}">Descrizione breve</span>
          </span>
          <i class="fa-solid fa-arrow-right restaurant-card__arrow"></i>
        </a>
      </div>
    </div>
  </div>
</section>

<!-- Fallback: lista piatta -->
<section class="section" th:if="${ristoranti != null}">
  <div class="container">
    <div class="restaurant-grid">
      <a th:each="ristorante : ${ristoranti}"
        th:href="@{/ristoranti/{id}(id=${ristorante.id})}"
         th:classappend="${ristorante.preferito} ? ' restaurant-card--featured' : ''"
         class="restaurant-card">
        <span th:if="${ristorante.preferito}" class="restaurant-card__badge">Consigliato</span>
        <span class="restaurant-card__icon"><i th:class="'fa-solid ' + ${ristorante.icona}"></i></span>
        <span class="restaurant-card__body">
          <span class="restaurant-card__title" th:text="${ristorante.nome}">Nome ristorante</span>
          <span class="restaurant-card__desc" th:text="${ristorante.descrizione}">Descrizione breve</span>
        </span>
        <i class="fa-solid fa-arrow-right restaurant-card__arrow"></i>
      </a>
    </div>
  </div>
</section>

<p class="restaurant-empty-state" id="restaurantEmptyState" hidden>
  <i class="fa-solid fa-magnifying-glass"></i> Nessun ristorante trovato. Prova con un altro nome.
</p>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
(function () {
  "use strict";

  var chips = Array.prototype.slice.call(document.querySelectorAll('.filter-chip'));
  var categories = Array.prototype.slice.call(document.querySelectorAll('.restaurant-category'));
  var searchInput = document.getElementById('restaurantSearchInput');
  var emptyState = document.getElementById('restaurantEmptyState');

  chips.forEach(function (chip) {
    chip.addEventListener('click', function () {
      chips.forEach(function (c) { c.classList.remove('active'); });
      chip.classList.add('active');

      var target = chip.getAttribute('data-filter');

      categories.forEach(function (cat) {
        cat.style.display = (target === 'all' || cat.id === target) ? '' : 'none';
      });

      if (target !== 'all') {
        var el = document.getElementById(target);
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
  });

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      var query = searchInput.value.trim().toLowerCase();
      var anyVisible = false;

      categories.forEach(function (cat) { cat.style.display = ''; });
      if (query.length > 0) {
        chips.forEach(function (c) { c.classList.remove('active'); });
      } else if (chips.length) {
        chips[0].classList.add('active');
      }

      categories.forEach(function (cat) {
        var cards = Array.prototype.slice.call(cat.querySelectorAll('.restaurant-card'));
        var visibleCount = 0;

        cards.forEach(function (card) {
          var title = card.querySelector('.restaurant-card__title').textContent.toLowerCase();
          var match = query === '' || title.indexOf(query) !== -1;
          card.style.display = match ? '' : 'none';
          if (match) visibleCount++;
        });

        cat.style.display = visibleCount > 0 ? '' : 'none';
        if (visibleCount > 0) anyVisible = true;
      });

      if (emptyState) emptyState.hidden = query === '' || anyVisible;
    });
  }
})();
</script>

</body>
</html>
