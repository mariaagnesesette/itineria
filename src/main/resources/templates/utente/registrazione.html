<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Registrazione</title>
</head>
<body>

    <header>
        <a href="../index.html" class="logo">ITINERARIA</a>
        <nav>
            <a th:href="@{/}" href="../index.html">Home</a>
            <a href="#">Luoghi d'interesse</a>
            <a href="#">Eventi</a>
            <a href="../footer/contattaci.html">Contatti</a>
        </nav>
    </header>

    <div class="registration-wrapper">
        <h1 class="main-title">Crea il tuo account</h1>

        <div class="auth-card">
            <form action="area-personale.html" method="GET">
                
                <!-- Nome & Cognome -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group half">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <!-- Password & Data di nascita -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <div class="form-group half">
                        <label for="dob">Data di nascita</label>
                        <input type="date" id="dob" required>
                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-group">
                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Registrati</button>

                <!-- Footer du formulaire -->
                <div class="auth-switch">
                    Hai già un account? <a href="accedi.html">Accedi</a>
                </div>

            </form>
        </div>
    </div>

    <footer>
        <p> 2025 Itineraria. Tutti i diritti riservati.</p>
        <p style="margin-top: 10px;">
            <a href="../footer/supporto.html">Supporto</a> | <a href="../footer/faq.html">FAQ</a> | <a href="../footer/contattaci.html">Contattaci</a>
        </p>
    </footer>

</body>
</html>
