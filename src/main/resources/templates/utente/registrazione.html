<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Registrazione</title>
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

    <header>

        <a th:href="@{/}" class="logo">ITINERARIA</a>
        <nav>
            <a th:href="@{/}" href="../index.html">Home</a>
            <a href="#">Luoghi d'interesse</a>
            <a href="#">Eventi</a>
            <a href="../footer/contattaci.html">Contatti</a>
        </nav>
    </header>

    <div class="registration-wrapper">
        <h1 class="main-title">Crea il tuo account</h1>

        <div class="auth-card">
            <form id="registrationForm" th:action="@{/utenti}" method="POST">

                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <!-- Nome & Cognome -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" autocomplete="given-name" required>
                    </div>
                    <div class="form-group half">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" name="cognome" autocomplete="family-name" required>

                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>

                    <input type="email" id="email" name="email" autocomplete="email" required>

                </div>

                <!-- Password & Data di nascita -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="password">Password</label>

                        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>
                    </div>
                    <div class="form-group half">
                        <label for="dob">Data di nascita</label>
                        <input type="date" id="dob" name="dataNascita" required>

                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-group">

                    <label for="nickname">Nickname</label>
                    <input type="text" id="nickname" name="username" autocomplete="username" minlength="3" required>

                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Registrati</button>
                <p id="registrationMessage" class="form-message" role="alert" aria-live="polite"></p>

                <!-- Footer du formulaire -->
                <div class="auth-switch">
                    Hai già un account? <a th:href="@{/accedi}">Accedi</a>
                </div>

            </form>
        </div>
    </div>

    <footer>
        <p> 2025 Itineraria. Tutti i diritti riservati.</p>
        <p style="margin-top: 10px;">
            <a href="../footer/supporto.html">Supporto</a> | <a href="../footer/faq.html">FAQ</a> | <a href="../footer/contattaci.html">Contattaci</a>
        </p>
    </footer>

    <script th:src="@{/js/utente/registrazione.js}" defer></script>
</body>
</html>
