<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Registrazione</title>
</head>
<body>

    <header>
        <a th:href="@{/}" class="logo">ITINERARIA</a>
        <nav>
            <a th:href="@{/}">Home</a>
            <a href="#">Luoghi d'interesse</a>
            <a href="#">Eventi</a>
            <a th:href="@{/contattaci}">Contatti</a>
        </nav>
    </header>

    <div class="registration-wrapper">
        <h1 class="main-title">Crea il tuo account</h1>

        <div class="auth-card">
            <form th:action="@{/utenti}" method="POST">
                
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">

                <!-- Nome & Cognome -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" required>
                    </div>
                    <div class="form-group half">
                        <label for="cognome">Cognome</label>
                        <input type="text" id="cognome" name="cognome" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <!-- Password & Data di nascita -->
                <div class="form-row">
                    <div class="form-group half">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <div class="form-group half">
                        <label for="dataNascita">Data di nascita</label>
                        <input type="date" id="dataNascita" name="dataNascita" required>
                    </div>
                </div>

                <!-- Nickname -->
                <div class="form-group">
                    <label for="username">Nickname</label>
                    <input type="text" id="username" name="username" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn-submit">Registrati</button>

                <!-- Footer du formulaire -->
                <div class="auth-switch">
                    Hai già un account? <a th:href="@{/accedi}">Accedi</a>
                </div>

            </form>
        </div>
    </div>

    <footer>
        <p> 2025 Itineraria. Tutti i diritti riservati.</p>
        <p style="margin-top: 10px;">
            <a th:href="@{/supporto}">Supporto</a> | <a th:href="@{/faq}">FAQ</a> | <a th:href="@{/contattaci}">Contattaci</a>
        </p>
    </footer>

</body>
</html>
