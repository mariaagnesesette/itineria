<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Accedi</title>
    <link rel="stylesheet" href="/css/pages.css">
</head>
<body>

    <header>
        <a th:href="@{/}" class="logo">ITINERARIA</a>
        <nav>
            <a th:href="@{/}" href="../index.html">Home</a>
            <a href="#">Luoghi d'interesse</a>
            <a href="#">Eventi</a>
            <a href="../footer/contattaci.html">Contatti</a>

        </nav>
    </header>

    <div class="auth-container">
        <h2>Bentornato</h2>
        <p class="subtitle">Accedi per gestire i tuoi itinerari e preferiti</p>

        <form id="loginForm" th:action="@{/login}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="inserisci la tua email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Accedi</button>
            <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>
        </form>

        <div class="auth-switch">
            Non sei ancora registrato? <a th:href="@{/registrazione}">Registrati qui</a>
        </div>
    </div>

    <footer>
        <p> 2025 Itineraria. Tutti i diritti riservati.</p>
        <p style="margin-top: 10px;">
            <a href="../footer/supporto.html">Supporto</a> | <a href="../footer/faq.html">FAQ</a> | <a href="../footer/contattaci.html">Contattaci</a>
        </p>
    </footer>

    <script th:src="@{/js/utente/accedi.js}" defer></script>
</body>
</html>
