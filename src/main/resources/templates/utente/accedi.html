<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Accedi</title>
      <!-- CSS GENERALE: contiene navbar e footer -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <!-- CSS DELLE PAGINE -->
    <link rel="stylesheet" th:href="@{/css/pages.css}">

    <link rel="icon" type="image/png" th:href="@{/images/favicon-bianco.png}">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body class="login-page">

   <div th:replace="~{fragments/navbar :: navbar(mostraAccedi=false)}"></div>


    

    <div class="auth-container">
        <h2>Bentornato</h2>
        <p class="subtitle">Accedi per gestire i tuoi itinerari e preferiti</p>

        <form id="loginForm" th:action="@{/login}" method="POST">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" name="email" autocomplete="email" required placeholder="inserisci la tua email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
                    <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostra password" aria-pressed="false">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-submit">Accedi</button>
            <p id="loginMessage" class="form-message" role="alert" aria-live="polite"></p>
        </form>

        <div class="auth-switch">
            Non sei ancora registrato? <a th:href="@{/registrazione}">Registrati qui</a>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script th:src="@{/js/utente/accedi.js}" defer></script>
    <script>
        (function () {
            "use strict";
            var toggle = document.getElementById('togglePassword');
            var input = document.getElementById('password');
            if (!toggle || !input) return;

            toggle.addEventListener('click', function () {
                var isVisible = input.type === 'text';
                input.type = isVisible ? 'password' : 'text';
                toggle.setAttribute('aria-pressed', String(!isVisible));
                toggle.setAttribute('aria-label', isVisible ? 'Mostra password' : 'Nascondi password');
                toggle.innerHTML = isVisible
                    ? '<i class="fa-solid fa-eye"></i>'
                    : '<i class="fa-solid fa-eye-slash"></i>';
            });
        })();
    </script>
</body>
</html>
