<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itineraria - Accedi</title>
</head>
<body>

    <header>
        <a href="index.html" class="logo">ITINERARIA</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="#">Luoghi d'interesse</a>
            <a href="#">Eventi</a>
            <a href="contattaci.html">Contatti</a>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Bentornato</h2>
        <p class="subtitle">Accedi per gestire i tuoi itinerari e preferiti</p>

        <form action="area-personale.html" method="GET">
            <div class="form-group">
                <label for="email">Indirizzo Email</label>
                <input type="email" id="email" required placeholder="inserisci la tua email">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-submit">Accedi</button>
        </form>

        <div class="auth-switch">
            Non sei ancora registrato? <a href="registrazione.html">Registrati qui</a>
        </div>
    </div>

    <footer>
        <p> 2025 Itineraria. Tutti i diritti riservati.</p>
        <p style="margin-top: 10px;">
            <a href="supporto.html">Supporto</a> | <a href="faq.html">FAQ</a> | <a href="contattaci.html">Contattaci</a>
        </p>
    </footer>

</body>
</html>
